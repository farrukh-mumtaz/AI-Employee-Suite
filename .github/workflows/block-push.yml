name: Protect Main Branch

on:
  push:
    branches:
      - main

jobs:
  check-author:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Push Permissions
        if: ${{ github.actor != 'farrukh-mumtaz' }}
        run: |
          echo "❌ Access Denied: Direct pushes to 'main' are blocked for user: ${{ github.actor }}"
          echo "Please create a feature branch and submit a Pull Request."
          exit 1

      - name: Access Approved
        if: ${{ github.actor == 'farrukh-mumtaz' }}
        run: |
          echo "✅ Welcome back, Admin! Direct push authorized for user: ${{ github.actor }}."
